<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Income BD</title>

<link rel="stylesheet" href="/style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<main class="wrap">

<header>

<div class="logo">FI</div>

<div>
<h1>Free Income BD</h1>
<p>Watch ads • Earn rewards</p>
</div>

</header>


<section class="card balance">

<span>Balance</span>

<strong id="balance">৳0</strong>

</section>


<section class="card">

<h2>📺 Watch Ads</h2>

<p>
Rewarded ads will be connected through the official ad-network integration.
</p>

<button id="watch">
Watch Ad
</button>

<small id="status"></small>

</section>


<section class="grid">

<div class="card">

<span>Ads watched</span>

<strong id="ads">0</strong>

</div>


<div class="card">

<span>Referrals</span>

<strong id="refs">0</strong>

</div>

</section>


<section class="card">

<h2>💸 Withdraw</h2>

<select id="method">

<option>bKash</option>

<option>Nagad</option>

</select>


<input
id="account"
placeholder="Account number"
/>


<button id="withdraw">
Request Withdrawal
</button>


<small id="withdrawStatus"></small>

</section>


<footer>

No activation fee • No fake balance

</footer>

</main>


<script>

const tg =
window.Telegram?.WebApp;

tg?.ready();

tg?.expand();


const user =
tg?.initDataUnsafe?.user;


const userId =
user?.id || "demo-user";


async function load() {

const response =
await fetch(
"/api/user/" +
encodeURIComponent(userId)
);

const userData =
await response.json();


document.querySelector(
"#balance"
).textContent =
"৳" + userData.balance;


document.querySelector(
"#ads"
).textContent =
userData.adsWatched;


document.querySelector(
"#refs"
).textContent =
userData.referrals;

}


load();


document.querySelector(
"#watch"
).onclick = () => {

document.querySelector(
"#status"
).textContent =
"Ad integration is not configured yet.";

};


document.querySelector(
"#withdraw"
).onclick =
async () => {

const account =
document.querySelector(
"#account"
).value.trim();


const method =
document.querySelector(
"#method"
).value;


const status =
document.querySelector(
"#withdrawStatus"
);


if (!account) {

status.textContent =
"Enter your account number.";

return;

}


const response =
await fetch(
"/api/withdraw",
{

method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({

userId,
method,
account

})

});


const data =
await response.json();


status.textContent =
data.error ||
"Withdrawal request submitted.";


if (data.ok) {

load();

}

};

</script>

</body>
</html>
